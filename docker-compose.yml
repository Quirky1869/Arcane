## Avec Traefik ###
services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    networks:
      - traefik-net
    ports:
      - '3552:3552'   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - /home/jason/docker:/app/data/projects # Changer l'utilisateur "jason" si besoin
    environment:
      - APP_URL=http://arcane.lab
      - PUID=1000 # A changer si besoin (command : id -> result : uid)
      - PGID=1000 # A changer si besoin (command: id -> result : gid)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.lab`)"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"

networks:
  traefik-net:
    external: true

volumes:
  arcane-data:
