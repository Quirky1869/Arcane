### Sans Traefik ###
services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - ${PROJECTS_PATH}:/app/data/projects # Changer la variable PROJECTS_PATH dans le .env, il doit ressembler à "/home/jason/docker"
    environment:
      - APP_URL=http://arcane.lab
      - PUID=1000 # A changer si besoin (command : id -> result : uid)
      - PGID=1000 # A changer si besoin (command: id -> result : gid)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
volumes:
  arcane-data:
