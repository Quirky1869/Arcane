---
theme: 'dark'

server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: 'info'

totp:
  issuer: 'lab.local'

authentication_backend:
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2id'
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 64

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.lab'
      policy: 'bypass'
    - domain: '*.lab'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  expiration: '1h'
  inactivity: '15m'
  cookies:
    - domain: 'lab'
      authelia_url: 'http://auth.lab'
      default_redirection_url: 'http://arcane.lab'

  redis:
    host: 'authelia-redis'
    port: 6379

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notifications.txt'
