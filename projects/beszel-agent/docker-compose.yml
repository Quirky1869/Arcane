services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host   # accès direct aux métriques réelles de la machine hôte
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro   # pour remonter aussi les stats Docker
    environment:
      LISTEN: 45876
      KEY: "clé généré via l'interface beszel dans 'Ajouter Système'"
      HUB_URL: "http://beszel.lab"
      #HUB_URL: "http://localhost:8090" # Sans Traefik
      TOKEN: "token généré via l'interface beszel dans 'Ajouter Système'"
