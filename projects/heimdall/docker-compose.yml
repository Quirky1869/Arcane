### Avec Traefik ###
services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    networks:
      - traefik-net
    environment:
      - PUID=1000 # check avec "id $USER"
      - PGID=1000
      - TZ=Europe/Paris
      - ALLOW_INTERNAL_REQUESTS=true
    volumes:
      - ./heimdall/config:/config
    ports:
      - 9999:80   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heimdall.rule=Host(`heimdall.lab`)"
      - "traefik.http.services.heimdall.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
