### Avec mkcert ###
# Nécessaire ici : le contexte sécurisé (HTTPS) est requis pour les outils
# basés sur LibreOffice (conversion Word/Excel/PowerPoint), sans quoi ces
# fonctions échouent silencieusement (SharedArrayBuffer non disponible).
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - "3033:8080"   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bentopdf.rule=Host(`bentopdf.home.lab`)"
      - "traefik.http.routers.bentopdf.entrypoints=websecure"
      - "traefik.http.routers.bentopdf.tls=true"
      - "traefik.http.services.bentopdf.loadbalancer.server.port=8080"

networks:
  traefik-net:
    external: true
