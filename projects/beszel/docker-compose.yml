### Avec Traefik ###
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      APP_URL: http://beszel.lab
    ports:
      - 8090:8090   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.lab`)"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

networks:
  traefik-net:
    external: true
