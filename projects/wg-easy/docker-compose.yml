### Avec mkcert ###
volumes:
  etc_wireguard:
 
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42
      traefik-net:
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"   # Le tunnel WireGuard — accès direct obligatoire (UDP, pas de Traefik possible)
      - "51821:51821/tcp"   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.wg-easy.rule=Host(`wg-easy.home.lab`)"
      - "traefik.http.routers.wg-easy.entrypoints=websecure"
      - "traefik.http.routers.wg-easy.tls=true"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"
 
networks:
  wg:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
  traefik-net:
    external: true

# Go to : http://192.168.1.124:51821/ or https://wg-easy.home.lab/ (if Technitium is configured to wg-easy)
