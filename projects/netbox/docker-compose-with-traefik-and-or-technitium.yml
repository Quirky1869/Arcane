## Avec Traefik ###
services:
  netbox:
    image: netboxcommunity/netbox:latest
    container_name: netbox
    restart: unless-stopped
    networks:
      - default
      - traefik-net
    ports:
      - "8000:8080"   # accès direct de secours (IP:port), le temps de mettre en place Technitium
    environment: &netbox-env
      SUPERUSER_API_TOKEN: "${NETBOX_API_TOKEN}"
      SUPERUSER_EMAIL: "admin@netbox.lab"
      SUPERUSER_NAME: "admin"
      SUPERUSER_PASSWORD: "${NETBOX_ADMIN_PASSWORD}"
      ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_NAME: netbox
      DB_PASSWORD: "${NETBOX_DB_PASSWORD}"
      DB_USER: netbox
      REDIS_CACHE_HOST: redis-cache
      REDIS_HOST: redis
      SECRET_KEY: "${NETBOX_SECRET_KEY}"
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.netbox.rule=Host(`netbox.lab`)"
      - "traefik.http.services.netbox.loadbalancer.server.port=8080"

  # Traite les tâches asynchrones (webhooks, rapports, scripts)
  netbox-worker:
    image: netboxcommunity/netbox:latest
    container_name: netbox-worker
    restart: unless-stopped
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker
    environment: *netbox-env
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    depends_on:
      - netbox

  # Note : depuis NetBox v4.4.0, le housekeeping tourne automatiquement
  # via le worker (RQ scheduler) — plus besoin de conteneur séparé.

  postgres:
    image: postgres:15-alpine
    container_name: netbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: "${NETBOX_DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netbox-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-cache:
    image: redis:7-alpine
    container_name: netbox-redis-cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  traefik-net:
    external: true

volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  postgres-data:
  redis-data:
